<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>设置 · 豆瓣同步到 Notion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="options">
  <main>
    <header class="page-head">
      <h1>设置</h1>
      <span class="muted">豆瓣同步到 Notion · 修改会自动保存</span>
    </header>

    <div id="banner" class="banner" hidden>
      <span id="bannerText"></span>
      <a id="bannerAction" class="primary as-button" href="import.html" hidden>批量导入 →</a>
    </div>

    <section class="panel">
      <h2><span class="step-num">1</span>连接 Notion</h2>
      <p class="muted">
        在 <a href="https://www.notion.so/profile/integrations" target="_blank" rel="noopener">Notion 集成页面</a>
        新建一个「内部集成」，复制它的 Token 填到这里。
      </p>
      <div class="input-row">
        <input type="password" id="notionToken" placeholder="ntn_… 或 secret_…" autocomplete="off" aria-label="Notion Token">
        <button type="button" id="toggleToken" class="secondary">显示</button>
      </div>
      <p id="tokenCheck" class="check" hidden></p>
    </section>

    <section class="panel">
      <h2><span class="step-num">2</span>选一个 Notion 页面</h2>
      <p class="muted">
        随便一个页面就行，空白页也可以。插件会在里面自动建好「我的书库」「我的影院」「我的剧集」；
        页面里已经有这些数据库的话，直接沿用，只补上缺少的字段。
      </p>
      <input type="text" id="parentPage" placeholder="粘贴页面链接，例如 https://www.notion.so/…" aria-label="Notion 页面链接">
      <p class="muted small-text">记得在这个页面右上角「…」→「连接」里添加你的集成，否则插件没有权限访问。</p>
      <p id="pageCheck" class="check" hidden></p>
      <ul id="plan" class="plan" hidden></ul>
      <button type="button" id="applyBtn" class="secondary" hidden>现在就建好 / 补全</button>
    </section>

    <section class="panel">
      <details id="advanced">
        <summary>已有数据库（可选）</summary>
        <p class="muted">
          想写进页面之外的某个数据库，可以在这里指定。插件只会补充字段、写入条目，不会新建。留空则按上面的页面自动处理。
        </p>
        <div class="db-row" data-type="book">
          <label class="field">
            <span>📚 图书数据库</span>
            <input type="text" id="bookDatabaseId" placeholder="数据库链接或 ID">
          </label>
        </div>
        <div class="db-row" data-type="movie">
          <label class="field">
            <span>🎬 电影数据库</span>
            <input type="text" id="movieDatabaseId" placeholder="数据库链接或 ID">
          </label>
        </div>
        <div class="db-row" data-type="tv">
          <label class="field">
            <span>📺 剧集数据库</span>
            <input type="text" id="tvDatabaseId" placeholder="数据库链接或 ID（可以和电影用同一个）">
          </label>
        </div>
      </details>
    </section>

    <p id="saveStatus" class="muted small-text" aria-live="polite"></p>
  </main>

  <script src="options.js" type="module"></script>
</body>
</html>
