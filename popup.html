<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆瓣同步到 Notion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="bar">
    <h1>豆瓣 → Notion</h1>
    <nav class="toolbar" aria-label="工具">
      <button id="openImport" class="tool-btn" title="批量导入你的豆瓣标记，或者豆列、标签、Top250 等列表">
        <span data-icon="import"></span><span>批量导入</span>
      </button>
      <button id="pinPanel" class="tool-btn" title="固定到侧边栏：不挡页面，切换页面时自动跟着变" hidden>
        <span data-icon="panel-right-open"></span><span>侧边栏</span>
      </button>
      <button id="refresh" class="tool-btn" title="重新读取当前页面（比如在页面上“加载更多”之后）" hidden>
        <span data-icon="refresh-cw"></span><span>重新读取</span>
      </button>
      <button id="openOptions" class="tool-btn icon-only" title="设置" aria-label="设置">
        <span data-icon="settings"></span>
      </button>
    </nav>
  </header>

  <main>
    <!-- 读取中 -->
    <div id="loading" class="skeleton" aria-label="正在读取页面">
      <div class="sk-cover"></div>
      <div class="sk-lines"><div></div><div></div><div></div></div>
    </div>

    <!-- 空状态：不是豆瓣页面 / 页面里没有条目 / 出错 -->
    <section id="empty" class="empty" hidden>
      <p id="emptyText"></p>
      <div class="empty-links">
        <a class="secondary as-button" href="https://book.douban.com/" target="_blank" rel="noopener">📚 豆瓣读书</a>
        <a class="secondary as-button" href="https://movie.douban.com/" target="_blank" rel="noopener">🎬 豆瓣电影</a>
      </div>
    </section>

    <!-- 单个条目 -->
    <section id="subject" class="stack" hidden>
      <div class="card">
        <img id="cover" class="cover" alt="">
        <div class="card-body">
          <h2 id="title"></h2>
          <p id="subtitle" class="muted"></p>
          <p id="meta" class="meta"></p>
          <div id="typeSwitch" class="segmented small" role="radiogroup" aria-label="保存为" hidden>
            <button type="button" role="radio" data-type="movie">电影</button>
            <button type="button" role="radio" data-type="tv">剧集</button>
          </div>
        </div>
      </div>

      <div class="mine">
        <div class="mine-row">
          <span class="mine-label">我的标记</span>
          <div id="statusSwitch" class="segmented" role="radiogroup" aria-label="我的标记"></div>
        </div>
        <div id="ratingRow" class="mine-row" hidden>
          <span class="mine-label">我的评分</span>
          <div id="stars" class="stars" role="radiogroup" aria-label="我的评分"></div>
        </div>
        <p id="markedFrom" class="muted small-text" hidden></p>
      </div>

      <p id="existing" class="hint" hidden></p>
      <div id="targetPicker" class="target-picker" hidden>
        <select id="targetSelect" aria-label="保存到哪个数据库"></select>
        <input id="newDbName" type="text" placeholder="新数据库的名字" aria-label="新数据库的名字" hidden>
      </div>

      <div id="setupNeeded" class="setup-box" hidden>
        <strong>还差一步：连接 Notion</strong>
        <p class="muted">填一个 Notion Token，再选一个 Notion 页面，插件会自动建好数据库。</p>
        <button id="goSettings" class="primary">去设置</button>
      </div>

      <button id="sync" class="primary" hidden>保存到 Notion</button>
      <a id="openNotion" class="primary as-button with-icon" target="_blank" rel="noopener" hidden><span>在 Notion 中打开</span><span data-icon="external-link"></span></a>
      <p id="result" class="result" hidden></p>
    </section>

    <!-- 列表页 -->
    <section id="list" class="stack" hidden>
      <div class="card list-card">
        <div class="card-body">
          <h2 id="listName"></h2>
          <p id="listMeta" class="muted"></p>
        </div>
      </div>
      <p id="listHint" class="hint" hidden></p>
      <button id="importPage" class="primary">挑选并导入这个列表</button>
    </section>
  </main>

  <footer id="autoFooter" class="auto-footer" hidden>
    <span data-icon="refresh-cw" data-size="13"></span>
    <span id="autoText"></span>
    <button id="autoAction" class="text-btn" hidden></button>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
