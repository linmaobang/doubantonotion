<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>豆瓣同步到 Notion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="bar">
    <h1>豆瓣 → Notion</h1>
    <div class="bar-links">
      <button id="openImport" class="text-btn">批量导入</button>
      <button id="openOptions" class="icon-btn" title="设置" aria-label="设置">⚙</button>
    </div>
  </header>

  <main>
    <div id="message" class="message" hidden></div>

    <section id="card" class="card" hidden>
      <img id="cover" class="cover" alt="">
      <div class="card-body">
        <h2 id="title"></h2>
        <p id="subtitle" class="muted"></p>
        <p id="meta" class="meta"></p>
        <label class="type-row">
          <span>保存为</span>
          <select id="itemType">
            <option value="book">图书</option>
            <option value="movie">电影</option>
            <option value="tv">剧集</option>
          </select>
        </label>
      </div>
    </section>

    <p id="existing" class="hint" hidden></p>

    <button id="sync" class="primary" hidden>保存到 Notion</button>
    <button id="goSettings" class="primary" hidden>打开设置</button>

    <p id="result" class="result" hidden></p>

    <section id="listCard" class="card list-card" hidden>
      <div class="card-body">
        <h2 id="listName"></h2>
        <p id="listMeta" class="muted"></p>
        <p id="listHint" class="hint" hidden></p>
      </div>
    </section>
    <button id="importPage" class="primary" hidden>批量导入这个页面</button>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
